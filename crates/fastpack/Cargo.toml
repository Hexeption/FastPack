[package]
name             = "fastpack"
description      = "FastPack — modern texture atlas packer"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
categories.workspace   = true
readme                 = "../../README.md"

[lib]
name = "fastpack"
path = "src/lib.rs"

[[bin]]
name = "fastpack"
path = "src/main.rs"

[dependencies]
fastpack-core.workspace     = true
fastpack-formats.workspace  = true
fastpack-compress = { workspace = true, features = ["jpeg-turbo", "webp-encode"] }
image.workspace             = true
thiserror.workspace         = true
anyhow.workspace            = true
serde.workspace             = true
serde_json.workspace        = true
rayon.workspace             = true
tracing.workspace           = true
tracing-subscriber.workspace = true
tokio.workspace              = true

clap                  = { version = "4", features = ["derive", "env", "wrap_help", "color"] }
toml                  = "1.1"
toml_edit             = "0.25"
notify                = "8"
notify-debouncer-mini = "0.7"
indicatif             = { version = "0.18", features = ["rayon"] }
console               = "0.16"
glob                  = "0.3"
walkdir               = "2"
humansize             = "2"

[dev-dependencies]
tempfile           = "3"
serde_json.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
